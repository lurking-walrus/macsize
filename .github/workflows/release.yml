# Signed, notarized release + Sparkle appcast + CLI update manifest.
# Triggered by pushing a tag like v1.2.3 (or v1.3.0-beta.1 for a prerelease), or by
# auto-release.yml dispatching this workflow on such a tag (`gh workflow run --ref vX.Y.Z`).
# One-time setup: scripts/setup-release-secrets.sh, see docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  # Used by auto-release.yml. Must be run on a tag ref; the release environment only
  # allows v* tags, so the signing secrets are never exposed to branch runs.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    environment: release
    timeout-minutes: 90
    env:
      APP_NAME: MacSize
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      OUTPUT_DIR: ${{ github.workspace }}/build
      DIST_DIR: ${{ github.workspace }}/dist
    steps:
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a vX.Y.Z tag (got ${GITHUB_REF})."
          exit 1

      - name: Check release configuration
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD NOTARY_API_KEY_P8_BASE64 \
                      NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          for name in APPLE_TEAM_ID BUNDLE_ID SPARKLE_PUBLIC_ED_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing variable $name"; missing=1; fi
          done
          if [[ $missing -ne 0 ]]; then
            echo "::error::Configure the 'release' environment with scripts/setup-release-secrets.sh (see docs/RELEASING.md)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "RELEASE_BASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
            echo "SPARKLE_FEED_URL=https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml"
            echo "DOWNLOAD_PREFIX=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          } >> "$GITHUB_ENV"
          echo "Releasing $VERSION (build $BUILD_NUMBER)"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Stamp version
        run: scripts/stamp-version.sh

      - name: Resolve packages
        run: |
          swift package resolve
          SPARKLE_BIN="$PWD/.build/artifacts/sparkle/Sparkle/bin"
          for tool in generate_appcast sign_update; do
            if [[ ! -x "$SPARKLE_BIN/$tool" ]]; then
              echo "::error::Sparkle tool $tool not found in $SPARKLE_BIN"
              find .build/artifacts -maxdepth 4 -name bin -type d || true
              exit 1
            fi
          done
          echo "SPARKLE_BIN=$SPARKLE_BIN" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put the temporary keychain first in the search list so codesign finds it.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | grep -F "($APPLE_TEAM_ID)" \
            | head -n 1 | awk '{print $2}')"
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity for team $APPLE_TEAM_ID in the imported certificate"
            security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/"[^"]*"/"<redacted>"/'
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Write notary API key
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary/AuthKey.p8"
          mkdir -p "$(dirname "$NOTARY_KEY_PATH")"
          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

          # notarize <file>: submit, wait, print the log on failure.
          cat > "$RUNNER_TEMP/notarize.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          file="$1"
          echo "Submitting $(basename "$file") for notarization"
          out="$(xcrun notarytool submit "$file" \
            --key "$NOTARY_KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" \
            --wait --timeout 45m --output-format json)"
          echo "$out"
          status="$(jq -r '.status' <<<"$out")"
          id="$(jq -r '.id' <<<"$out")"
          if [[ "$status" != "Accepted" ]]; then
            echo "::error::Notarization of $(basename "$file") finished with status $status"
            xcrun notarytool log "$id" \
              --key "$NOTARY_KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" || true
            exit 1
          fi
          SH
          chmod +x "$RUNNER_TEMP/notarize.sh"
          echo "NOTARIZE=$RUNNER_TEMP/notarize.sh" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          ARCHS: arm64 x86_64
        run: |
          scripts/build-app.sh
          APP="$OUTPUT_DIR/$APP_NAME.app"
          echo "APP=$APP" >> "$GITHUB_ENV"

          lipo -archs "$APP/Contents/MacOS/$APP_NAME"
          lipo -archs "$APP/Contents/Helpers/macsize"
          for bin in "$APP/Contents/MacOS/$APP_NAME" "$APP/Contents/Helpers/macsize"; do
            archs="$(lipo -archs "$bin")"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::$bin is not universal ($archs)"; exit 1; }
          done

          codesign --verify --strict --deep --verbose=2 "$APP"
          details="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          grep -E '^(Identifier|TeamIdentifier|Runtime Version|Timestamp)=' <<<"$details" || true
          grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<<"$details" || { echo "::error::App is not signed by team $APPLE_TEAM_ID"; exit 1; }
          grep -q 'flags=.*runtime' <<<"$details" || { echo "::error::Hardened runtime is not enabled"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP/Contents/Info.plist"

      - name: Notarize and staple app
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          mkdir -p "$DIST_DIR" "$RUNNER_TEMP/notary-upload"
          SUBMIT_ZIP="$RUNNER_TEMP/notary-upload/$APP_NAME.zip"
          ditto -c -k --keepParent "$APP" "$SUBMIT_ZIP"
          "$NOTARIZE" "$SUBMIT_ZIP"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

          # The archive Sparkle and users download.
          APP_ZIP="$DIST_DIR/$APP_NAME-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$APP_ZIP"
          echo "APP_ZIP=$APP_ZIP" >> "$GITHUB_ENV"

      - name: Build, sign and notarize DMG
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          STAGING="$RUNNER_TEMP/dmg"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/$APP_NAME.app"
          ln -s /Applications "$STAGING/Applications"
          DMG="$DIST_DIR/$APP_NAME-$VERSION.dmg"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp "$DMG"
          "$NOTARIZE" "$DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize CLI and build tarball
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          CLI_DIR="$RUNNER_TEMP/cli"
          rm -rf "$CLI_DIR" && mkdir -p "$CLI_DIR"
          # Same binary that ships inside the app: universal, Developer ID-signed, hardened runtime.
          cp "$APP/Contents/Helpers/macsize" "$CLI_DIR/macsize"
          codesign --verify --strict --verbose=2 "$CLI_DIR/macsize"
          lipo -archs "$CLI_DIR/macsize"
          "$CLI_DIR/macsize" --version || true

          # A bare Mach-O can't be stapled; Gatekeeper fetches the ticket online.
          ditto -c -k --keepParent "$CLI_DIR/macsize" "$RUNNER_TEMP/notary-upload/macsize.zip"
          "$NOTARIZE" "$RUNNER_TEMP/notary-upload/macsize.zip"

          CLI_TARBALL="$DIST_DIR/macsize-$VERSION-macos-universal.tar.gz"
          tar -C "$CLI_DIR" -czf "$CLI_TARBALL" macsize
          tar -tzf "$CLI_TARBALL"
          echo "CLI_TARBALL=$CLI_TARBALL" >> "$GITHUB_ENV"

      - name: Generate appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          UPDATES="$RUNNER_TEMP/updates"
          rm -rf "$UPDATES" && mkdir -p "$UPDATES"
          # Start from the latest published (non-prerelease) appcast so older entries are kept.
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$UPDATES" 2>/dev/null; then
            echo "Updating the previous appcast.xml"
          else
            echo "No previous appcast.xml found (first release?); starting a new one"
          fi
          cp "$APP_ZIP" "$UPDATES/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --maximum-deltas 0 \
            "$UPDATES"
          cp "$UPDATES/appcast.xml" "$DIST_DIR/appcast.xml"
          grep -q "sparkle:edSignature" "$DIST_DIR/appcast.xml" || { echo "::error::appcast.xml has no EdDSA signature"; exit 1; }
          grep -q "$DOWNLOAD_PREFIX/$APP_NAME-$VERSION.zip" "$DIST_DIR/appcast.xml" || { echo "::error::appcast.xml has no entry for $VERSION"; exit 1; }
          cat "$DIST_DIR/appcast.xml"

      - name: Write latest.json
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          ED_SIGNATURE="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_BIN/sign_update" --ed-key-file - -p "$CLI_TARBALL")"
          [[ -n "$ED_SIGNATURE" ]] || { echo "::error::sign_update produced no signature"; exit 1; }
          SHA256="$(shasum -a 256 "$CLI_TARBALL" | awk '{print $1}')"
          jq -n \
            --arg version "$VERSION" \
            --arg build "$BUILD_NUMBER" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg cli_url "$DOWNLOAD_PREFIX/$(basename "$CLI_TARBALL")" \
            --arg sha256 "$SHA256" \
            --arg ed_signature "$ED_SIGNATURE" \
            --arg app_url "$DOWNLOAD_PREFIX/$(basename "$APP_ZIP")" \
            --arg dmg_url "$DOWNLOAD_PREFIX/$(basename "$DMG")" \
            '{version: $version, build: $build, published_at: $published_at,
              cli: {url: $cli_url, sha256: $sha256, ed_signature: $ed_signature},
              app: {url: $app_url, dmg_url: $dmg_url}}' > "$DIST_DIR/latest.json"
          cat "$DIST_DIR/latest.json"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag --title "$APP_NAME $VERSION")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          (cd "$DIST_DIR" && shasum -a 256 ./* > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            "$APP_ZIP" "$DMG" "$CLI_TARBALL" \
            "$DIST_DIR/appcast.xml" "$DIST_DIR/latest.json" "$DIST_DIR/SHA256SUMS.txt"

      - name: Clean up keychain and keys
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" && -f "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/cert.p12"
