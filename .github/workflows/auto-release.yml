# Cuts a release automatically when a merge to main adds a new version to CHANGELOG.md.
#
# Convention: the first "## X.Y.Z" heading in CHANGELOG.md is the version to ship.
# When that version has no vX.Y.Z tag yet (and is newer than the latest release tag),
# this workflow tags the merged commit and dispatches release.yml on the tag. Merges that
# don't add a new version heading don't release anything.
#
# Tags pushed with GITHUB_TOKEN don't trigger other workflows, so release.yml is started
# explicitly with `gh workflow run --ref <tag>`. It still runs on the tag, which is what
# the "release" environment (and its signing secrets) is restricted to.
name: Auto release

on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write   # push the tag
  actions: write    # dispatch release.yml

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine version from CHANGELOG.md
        id: version
        run: |
          set -euo pipefail
          version="$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?[[:space:]]*$' CHANGELOG.md \
            | sed -E 's/^## //; s/[[:space:]]+$//' || true)"
          if [[ -z "$version" ]]; then
            echo "No '## X.Y.Z' heading in CHANGELOG.md; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="v$version"
          git fetch --tags --force --quiet
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest="$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -1)"
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]]; then
            echo "::error::CHANGELOG.md's top version $version is not newer than the latest tag v$latest."
            exit 1
          fi
          echo "Releasing $tag (previous: ${latest:+v$latest})"
          {
            echo "release=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the merged commit
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "MacSize $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Start the release workflow on the tag
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched release.yml for $TAG: https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml"
